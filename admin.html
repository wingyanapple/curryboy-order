<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CurryBoy 後台 · 訂單</title>
<style>
  :root{--org:#e8843a;--bg:#f6f1e7;--card:#fff;--line:#e7ddca;--ink:#2a2118;--muted:#8b7e6a;--red:#e5484d;--yel:#e0a413;--grn:#2f9e56}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
  .top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;gap:10px;z-index:5}
  .top .logo{font-weight:900;color:var(--org);font-size:18px}
  .top .sp{flex:1}
  .top .st{font-size:12px;color:var(--muted)}
  .top button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-weight:700;font-size:13px;color:var(--ink)}
  .wrap{max-width:640px;margin:0 auto;padding:14px 12px}
  /* login */
  .login{max-width:360px;margin:14vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center}
  .login h1{color:var(--org);font-size:22px;margin-bottom:4px}
  .login p{color:var(--muted);font-size:13px;margin-bottom:18px}
  .login input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:12px}
  .login button{width:100%;padding:13px;background:var(--org);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:16px}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
  /* controls */
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:#fff;border:none;padding:8px 12px;font-size:13px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--org);color:#fff}
  .tabs{display:flex;gap:5px;background:var(--card);border-bottom:1px solid var(--line);padding:8px 10px;position:sticky;top:49px;z-index:4}
  .tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
  .tabs button.on{background:var(--org);color:#fff;border-color:var(--org)}
  .invrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px}
  .invrow .inm{flex:1;font-weight:700;font-size:15px}
  .invok{font-size:12px;color:var(--grn);font-weight:700}
  .invso{font-size:12px;color:var(--red);font-weight:800}
  .invoff{border:1px solid var(--line);background:#fff;color:var(--red);border-radius:8px;padding:9px 13px;font-weight:700;font-size:13px;white-space:nowrap}
  .invon{border:none;background:var(--grn);color:#fff;border-radius:8px;padding:9px 13px;font-weight:700;font-size:13px;white-space:nowrap}
  .slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
  .slotbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;padding:11px 6px;font-weight:800;font-size:16px;border:1.5px solid}
  .slotbtn small{font-size:11px;font-weight:700}
  .slotbtn.open{background:#eefaf1;border-color:var(--grn);color:var(--grn)}
  .slotbtn.closed{background:#fdecec;border-color:var(--red);color:var(--red)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .kpi .kv{font-size:26px;font-weight:900}
  .kpi .kl{font-size:12px;color:var(--muted);margin-top:3px}
  .sh{font-size:15px;margin:18px 4px 8px;color:var(--ink)}
  .srow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:7px;font-size:15px}
  .srow .sc{color:var(--muted);font-size:13px;margin-left:auto}
  .srow .sr{font-weight:800;color:var(--org);min-width:64px;text-align:right}
  .srow.mrow{border-left:4px solid var(--org)}
  .fbcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
  .fbtop{display:flex;align-items:center;gap:8px;font-size:13px}
  .fbtype{background:#fff3e0;color:#c26a1b;border-radius:6px;padding:2px 8px;font-weight:800;font-size:12px}
  .fbstars{color:#e0a413;letter-spacing:1px}
  .fbtime{color:var(--muted);font-size:12px}
  .fbmsg{margin-top:8px;font-size:15px;line-height:1.5}
  .fbph{margin-top:6px;font-size:12px;color:var(--muted)}
  .count{font-size:13px;color:var(--muted)}
  /* order card */
  .datesep{font-size:14px;font-weight:800;color:var(--ink);margin:18px 2px 10px;padding-bottom:7px;border-bottom:2px solid var(--org)}
  .datesep.dtog{cursor:pointer;user-select:none;color:var(--muted);border-bottom-color:var(--line)}
  .datesep .arw{display:inline-block;width:16px;color:var(--org);font-weight:900}
  .datesep .dn{font-weight:700;font-size:12px;color:var(--muted)}
  .ord{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:13px;padding:14px;margin-bottom:12px}
  .ord.s-paid{border-left-color:var(--red)}
  .ord.s-making{border-left-color:var(--yel)}
  .ord.s-done{border-left-color:var(--grn)}
  .ord .hd{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .ord .no{font-size:22px;font-weight:900;letter-spacing:1px}
  .pill{font-size:12px;font-weight:800;border-radius:20px;padding:3px 10px;color:#fff}
  .pill.paid{background:var(--red)}.pill.making{background:var(--yel)}.pill.done{background:var(--grn)}
  .ord .sp{flex:1}
  .ord .times{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
  .ord .items{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:9px 0;margin:8px 0;font-size:14px;line-height:1.7}
  .ord .it{display:flex;justify-content:space-between;gap:10px}
  .ord .it small{color:var(--muted);font-size:12px;display:block}
  .ord .ph{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px}
  .ord .ph a{color:var(--org);font-weight:800;text-decoration:none}
  .vip{background:#fff3e0;color:#c26a1b;border:1px solid #f0c48a;border-radius:6px;font-size:11px;font-weight:800;padding:2px 7px}
  .cust{background:#f1ece1;color:#8b7e6a;border:1px solid var(--line);border-radius:6px;font-size:11px;font-weight:700;padding:2px 7px}
  .ord .ft{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}
  .ord .tot{font-size:19px;font-weight:900;flex:1}
  .ord .ft button{border:none;border-radius:9px;padding:10px 14px;font-weight:800;font-size:14px;color:#fff}
  .b-mk{background:var(--yel)}.b-dn{background:var(--grn)}.b-bk{background:#fff;color:var(--muted);border:1px solid var(--line)!important}
  .b-rp{background:#8b7e6a}
  .prn{font-size:11px;font-weight:800;padding:2px 8px;border-radius:12px}
  .prn.y{color:var(--grn);background:#eefaf1}.prn.n{color:var(--muted);background:#f1ece1}
  #cbtoast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#2a2118;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:700;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}
  .ord.s-pending{border-left-color:var(--muted)}
  .pill.pending{background:var(--muted)}
  .pk-far{display:inline-block;font-size:21px;font-weight:900;color:var(--org);background:#fff3e6;border:1px solid #f0c48a;border-radius:10px;padding:6px 12px;margin:2px 0 10px}
  .pk-far span{font-size:13px;font-weight:800;color:#c26a1b}
  .items .it.uten{font-size:16px;font-weight:800;color:var(--ink);padding:3px 0}
  .tabs .badge{display:inline-block;min-width:15px;margin-left:2px;padding:0 3px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;font-weight:800;line-height:15px;font-style:normal;vertical-align:top}
</style>
</head>
<body>
<div id="root"></div>
<script>
const API='https://kpjilykqswlogxhjmnwj.supabase.co/functions/v1/admin-api';
let PW=localStorage.getItem('cb_admin_pw')||'';
let ST={orders:[],counts:{},sort:'created',err:'',loading:false,tab:'orders',inv:{},slotClosed:{},stats:null,feedback:null};
const MENU=[
  ['套餐（賣晒可售罄）',[['curryrice','咖喱飯套餐'],['tsukemen','咖喱沾麵套餐'],['roti','咖喱薄餅套餐'],['soupnoodle','湯麵套餐']]],
  ['咖喱',[['c_butter','牛油咖喱'],['c_ghost','麻辣咖喱'],['c_king','黑椒咖喱'],['c_queen','小荳蔻咖喱']]],
  ['主菜',[['m_chicken','鼠尾草烤雞'],['m_brisket','白滷水牛腩'],['m_iberico','黑毛豬肉餅'],['m_miso','味噌燒茄子'],['m_tonkatsu','吉列薄豬扒'],['m_fish','吉列魚柳'],['m_chashu','炙燒叉燒']]],
  ['湯（湯麵用）',[['s_beef','牛骨湯'],['s_tomato','蕃茄湯'],['s_curry','湯咖喱']]],
  ['加配蛋',[['e_egg','太陽蛋'],['e_soft','醬油漬溏心蛋'],['e_yolk','醬油漬蛋黃']]],
  ['汽水',[['sd_coke','可樂'],['sd_cokez','無糖可樂'],['sd_cream','玉泉忌廉'],['sd_soda','梳打水']]],
  ['飲品',[['d_lt','檸檬茶'],['d_lw','檸檬水'],['d_mt','奶茶'],['d_cf','咖啡'],['d_yy','鴛鴦'],['d_rb','紅豆冰'],['d_ms','忌廉鮮奶'],['d_choc','凍朱古力'],['d_cbc','冷泡咖啡'],['d_cbt','冷泡茶']]],
  ['小食',[['k1','咖喱魚蛋'],['k2','咖喱燒賣'],['k3','蒜蓉包'],['k4','手工咖喱角'],['k5','咖喱燒賣魚蛋'],['k6','咖喱年糕'],['k7','炸翠玉瓜'],['k8','牛油粟米'],['k9','吉列炸蠔'],['k10','阿多波炸雞'],['k11','青檸椒鹽粟米'],['k12','甜脆香雞翼'],['k13','咖喱炸魚皮'],['k14','老海灣薯條'],['k15','霹靂雞軟骨'],['k16','蝦多士'],['k17','檸檬番薯條']]],
  ['丼飯',[['don_iberico','蔥油黑毛豬肉餅飯'],['don_tonkatsu','甜醬油吉列薄豬扒飯'],['don_oyako','親子烤雞飯'],['don_halibut','西京燒比目魚']]]
];
let timer=null;

async function api(action,extra){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({password:PW,action},extra||{}))});
  return await r.json().catch(()=>({ok:false,error:'網絡問題'}));
}
async function login(){
  const v=document.getElementById('pw').value;
  ST.err='';PW=v;
  const res=await api('list');
  if(res&&res.ok){localStorage.setItem('cb_admin_pw',PW);ST.orders=res.orders||[];ST.pending=res.pending||[];ST.counts=res.counts||{};ST.spend=res.spend||{};startPoll();render();}
  else{PW='';ST.err=(res&&res.error)||'登入失敗';render();}
}
function logout(){PW='';localStorage.removeItem('cb_admin_pw');clearInterval(timer);ST={orders:[],counts:{},sort:'created',err:'',loading:false};render();}
async function refresh(){const res=await api('list');if(res&&res.ok){ST.orders=res.orders||[];ST.pending=res.pending||[];ST.counts=res.counts||{};ST.spend=res.spend||{};render();}else if(res&&res.error==='密碼錯誤'){logout();}}
function startPoll(){clearInterval(timer);timer=setInterval(refresh,8000);}
async function setStatus(id,status){await api('set_status',{id,status});refresh();}
function setSort(s){ST.sort=s;render();}
function toast(msg){var t=document.getElementById('cbtoast');if(!t){t=document.createElement('div');t.id='cbtoast';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0';},2400);}
async function reprint(id){if(!confirm('重新打印呢張單？（會出返 2 張）'))return;const res=await api('reprint',{id});toast(res&&res.ok?'已送去打印機，稍等出單':'重印失敗，請再試');refresh();}

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hhmm(iso){try{const d=new Date(iso);return d.toLocaleTimeString('zh-HK',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){return '';}}
function hkdate(iso){try{return new Date(iso).toLocaleDateString('en-CA',{timeZone:'Asia/Hong_Kong'});}catch(e){return '';}}
function dayLabel(iso){
  const d=hkdate(iso), today=hkdate(new Date().toISOString()), yest=hkdate(new Date(Date.now()-86400000).toISOString());
  const p=d.split('-'); const nice=(p[1]?parseInt(p[1],10):'')+'月'+(p[2]?parseInt(p[2],10):'')+'日';
  return nice+(d===today?'（今日）':d===yest?'（昨日）':'');
}

function render(){
  const root=document.getElementById('root');
  if(!PW){
    root.innerHTML='<div class="login"><h1>CurryBoy 後台</h1><p>請輸入後台密碼</p>'+
      '<input id="pw" type="password" placeholder="密碼" onkeydown="if(event.key===\'Enter\')login()">'+
      '<button onclick="login()">登入</button><div class="err">'+esc(ST.err)+'</div></div>';
    return;
  }
  const tab=ST.tab||'orders';
  const top='<div class="top"><span class="logo">CurryBoy</span><div class="sp"></div><span class="st" id="clk"></span><button onclick="logout()">登出</button></div>';
  const npd=(ST.pending||[]).filter(function(o){return hkdate(o.created_at)===todayHK();}).length;
  const tabs='<div class="tabs">'+
    '<button class="'+(tab==='orders'?'on':'')+'" onclick="setTab(\'orders\')">訂單</button>'+
    '<button class="'+(tab==='pending'?'on':'')+'" onclick="setTab(\'pending\')">未完成'+(npd?'<i class="badge">'+npd+'</i>':'')+'</button>'+
    '<button class="'+(tab==='inventory'?'on':'')+'" onclick="setTab(\'inventory\')">庫存</button>'+
    '<button class="'+(tab==='slots'?'on':'')+'" onclick="setTab(\'slots\')">時段</button>'+
    '<button class="'+(tab==='stats'?'on':'')+'" onclick="setTab(\'stats\')">數據</button>'+
    '<button class="'+(tab==='feedback'?'on':'')+'" onclick="setTab(\'feedback\')">意見</button></div>';
  const bodyHtml=tab==='pending'?renderPending():tab==='inventory'?renderInventory():tab==='slots'?renderSlots():tab==='stats'?renderStats():tab==='feedback'?renderFeedback():renderOrders();
  root.innerHTML=top+tabs+'<div class="wrap">'+bodyHtml+'</div>';
  const clk=document.getElementById('clk');if(clk)clk.textContent='自動更新 · '+hhmm(new Date().toISOString());
}
function todayHK(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Hong_Kong'});}
function pickupInfo(slot,iso){
  const m=/(\d{1,2}):(\d{2})/.exec(slot||'');if(!m)return{mins:null,far:false};
  // 用「訂單當日日期 + 取餐時間」做完整時間，先計返而家去到取餐仲有幾耐（唔會將琴日單當今日）
  const dstr=iso?new Date(iso).toLocaleDateString('en-CA',{timeZone:'Asia/Hong_Kong'}):todayHK();
  const pickup=new Date(dstr+'T'+String(m[1]).padStart(2,'0')+':'+m[2]+':00+08:00');
  const mins=Math.round((pickup.getTime()-Date.now())/60000);
  return {mins:mins,far:mins>30};
}
function toggleDay(dk){ST.openDays=ST.openDays||{};ST.openDays[dk]=!ST.openDays[dk];render();}
function groupDays(list,dateOf){
  const today=todayHK();const groups=[],ix={};
  list.forEach(function(o){var dk=hkdate(dateOf(o));if(!(dk in ix)){ix[dk]=groups.length;groups.push([dk,dateOf(o),[]]);}groups[ix[dk]][2].push(o);});
  let html='';
  groups.forEach(function(g){
    var dk=g[0],iso=g[1],os=g[2],isToday=dk===today;
    var open=isToday||(ST.openDays&&ST.openDays[dk]);
    if(isToday){html+='<div class="datesep">'+dayLabel(iso)+'</div>'+os.map(orderCard).join('');}
    else{
      html+='<div class="datesep dtog" onclick="toggleDay(\''+dk+'\')"><span class="arw">'+(open?'▾':'▸')+'</span>'+dayLabel(iso)+' <span class="dn">('+os.length+' 張)</span></div>';
      if(open)html+=os.map(orderCard).join('');
    }
  });
  return html;
}
function orderCard(o){
  const isP=o.status==='pending';
  const lab={paid:'已付款',making:'製作中',done:'已完成',pending:'未完成付款'}[o.status]||o.status;
  const items=(o.cb_order_items||[]).map(i=>'<div class="it"><span>'+esc(i.label)+(i.qty>1?' ×'+i.qty:'')+(i.item_desc?'<small>'+esc(i.item_desc)+'</small>':'')+'</span><span>$'+(i.unit*i.qty)+'</span></div>').join('')||'<div class="it"><small>（無明細）</small></div>';
  const vc=ST.counts[o.phone]||0;
  const vs=(ST.spend||{})[o.phone]||0;
  const vip=vc>1?'<span class="vip">熟客 · 第'+vc+'次 · 累積 $'+vs+'</span>':'<span class="cust">第'+vc+'次 · 累積 $'+vs+'</span>';
  const pk=pickupInfo(o.pickup_slot,o.paid_at||o.created_at);
  const bigPk=(!isP&&pk.far)?'<div class="pk-far">取餐 '+esc(o.pickup_slot||'-')+' <span>'+pk.mins+' 分鐘後</span></div>':'';
  const uten=o.utensil?'<div class="it uten"><span>外賣餐具 ×'+o.utensil+'</span><span>$'+o.utensil+'</span></div>':'<div class="it uten"><span>餐具：唔使</span></div>';
  const foot=isP
    ?'<div class="ft"><div class="tot">$'+o.total+'</div><span class="cust">未付款 · 唔會出單</span></div>'
    :'<div class="ft"><div class="tot">$'+o.total+'</div><span class="prn '+(o.printed_at?'y':'n')+'">'+(o.printed_at?'🖨 已印':'🖨 未印')+'</span><button class="b-rp" onclick="reprint('+o.id+')">重印</button></div>';
  return '<div class="ord s-'+o.status+'"><div class="hd"><div class="no">'+esc(o.order_no)+'</div><span class="pill '+o.status+'">'+lab+'</span><div class="sp"></div>'+
    '<div class="times">落單 '+hhmm(o.paid_at||o.created_at)+'<br>取餐 <b'+(pk.far&&!isP?' style="color:var(--org)"':'')+'>'+esc(o.pickup_slot||'-')+'</b></div></div>'+
    bigPk+
    '<div class="ph">📞 <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a> '+vip+'</div>'+
    '<div class="items">'+items+uten+'</div>'+
    (o.note?'<div style="font-size:13px;color:var(--muted)">備註：'+esc(o.note)+'</div>':'')+
    foot+'</div>';
}
function renderPending(){
  const list=(ST.pending||[]).slice();
  const todayN=list.filter(function(o){return hkdate(o.created_at)===todayHK();}).length;
  const bar='<div class="bar"><span class="count">今日未完成付款 <b style="color:var(--muted)">'+todayN+'</b> 張</span></div>';
  const note='<div style="font-size:13px;color:var(--muted);margin:2px 4px 12px;line-height:1.6">呢度係「落咗單但未俾到錢」嘅單（缺咗嘅號碼多數喺呢度）。呢啲<b>唔會自動出單</b>；若客真係扣咗錢，要去 Wonder 後台跟。過往日子摺埋咗，撳日期可展開。</div>';
  if(!list.length)return bar+note+'<div class="empty">暫時冇未完成付款嘅單</div>';
  return bar+note+groupDays(list,function(o){return o.created_at;});
}
function renderOrders(){
  let list=ST.orders.slice();
  if(ST.sort==='pickup')list.sort((a,b)=>String(a.pickup_slot||'').localeCompare(String(b.pickup_slot||'')));
  else list.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  const todayCnt=list.filter(o=>hkdate(o.paid_at||o.created_at)===todayHK()).length;
  const bar='<div class="bar"><span class="count">今日 <b style="color:var(--org)">'+todayCnt+'</b> 張</span><div class="sp" style="flex:1"></div><div class="seg"><button class="'+(ST.sort==='created'?'on':'')+'" onclick="setSort(\'created\')">落單順序</button><button class="'+(ST.sort==='pickup'?'on':'')+'" onclick="setSort(\'pickup\')">取餐時間</button></div></div>';
  if(!list.length)return bar+'<div class="empty">暫時未有訂單<br><span style="font-size:13px">有客付款後會即刻喺度出現</span></div>';
  return bar+groupDays(list,function(o){return o.paid_at||o.created_at;});
}
function renderInventory(){
  return '<div style="font-size:13px;color:var(--muted);margin:6px 4px 10px">㩒「設為售罄」→ 客人端即時見到灰、揀唔到；隨時可恢復。</div>'+MENU.map(function(g){
    return '<h3 style="margin:16px 4px 8px;font-size:15px;color:var(--ink)">'+g[0]+'</h3>'+g[1].map(function(it){
      var st=ST.inv[it[0]]||'available';var so=st==='sold_out';
      return '<div class="invrow"><span class="inm">'+esc(it[1])+'</span>'+(so?'<span class="invso">售罄</span>':'<span class="invok">供應中</span>')+'<button class="'+(so?'invon':'invoff')+'" onclick="toggleItem(\''+it[0]+'\',\''+st+'\')">'+(so?'恢復供應':'設為售罄')+'</button></div>';
    }).join('');
  }).join('');
}
async function loadInventory(){const res=await api('inventory_list');if(res&&res.ok){ST.inv={};(res.statuses||[]).forEach(function(x){ST.inv[x.item_id]=x.status;});render();}}
async function toggleItem(id,cur){const next=cur==='sold_out'?'available':'sold_out';await api('set_item_status',{item_id:id,status:next});ST.inv[id]=next;render();}
function setTab(t){ST.tab=t;render();if(t==='inventory')loadInventory();if(t==='slots')loadSlots();if(t==='stats')loadStats();if(t==='feedback')loadFeedback();}
async function loadStats(){const res=await api('stats');if(res&&res.ok){ST.stats=res.stats||null;render();}}
async function loadFeedback(){const res=await api('feedback_list');if(res&&res.ok){ST.feedback=res.feedback||[];render();}}
function monthNice(m){const p=String(m||'').split('-');return p[0]+'年'+(p[1]?parseInt(p[1],10):'')+'月';}
function renderStats(){
  const s=ST.stats;
  if(!s)return '<div class="empty">載入中…</div>';
  const t=s.today||{};
  const kpi='<div class="kpis">'+
    '<div class="kpi"><div class="kv" style="color:var(--org)">$'+(t.revenue||0)+'</div><div class="kl">今日營業額</div></div>'+
    '<div class="kpi"><div class="kv">'+(t.orders||0)+'</div><div class="kl">今日訂單</div></div></div>';
  const days=(s.days||[]).map(function(d){return '<div class="srow"><span>'+dayLabel(d.d+'T12:00:00+08:00')+'</span><span class="sc">'+d.orders+' 單</span><span class="sr">$'+d.revenue+'</span></div>';}).join('')||'<div class="srow"><small>未有記錄</small></div>';
  const months=(s.months||[]).map(function(m){return '<div class="srow mrow"><span>'+monthNice(m.m)+'</span><span class="sc">'+m.orders+' 單</span><span class="sr">$'+m.revenue+'</span></div>';}).join('')||'<div class="srow"><small>未有記錄</small></div>';
  return kpi+'<h3 class="sh">每日流水</h3>'+days+'<h3 class="sh">月結（逐月流水）</h3>'+months+'<div style="height:20px"></div>';
}
function renderFeedback(){
  const f=ST.feedback;
  if(!f)return '<div class="empty">載入中…</div>';
  if(!f.length)return '<div class="empty">暫時未有意見</div>';
  return f.map(function(x){
    const stars='★★★★★'.slice(0,x.rating||0)+'☆☆☆☆☆'.slice(0,5-(x.rating||0));
    return '<div class="fbcard"><div class="fbtop"><span class="fbtype">'+esc(x.type||'意見')+'</span><span class="fbstars">'+stars+'</span><span class="sp" style="flex:1"></span><span class="fbtime">'+dayLabel(x.created_at)+' '+hhmm(x.created_at)+'</span></div>'+(x.message?'<div class="fbmsg">'+esc(x.message)+'</div>':'')+(x.phone?'<div class="fbph">電話：'+esc(x.phone)+'</div>':'')+'</div>';
  }).join('');
}
function slotTimes(){const a=[];for(let t=11*60;t<=20*60;t+=15){const h=Math.floor(t/60),m=t%60;a.push((h<10?'0':'')+h+':'+(m<10?'0':'')+m);}return a;}
async function loadSlots(){const d=hkdate(new Date().toISOString());const res=await api('slots_list',{date:d});ST.slotClosed={};if(res&&res.ok){(res.closed||[]).forEach(function(x){ST.slotClosed[x.slot_time]=1;});}render();}
async function toggleSlot(t){const d=hkdate(new Date().toISOString());const closed=!ST.slotClosed[t];if(closed)ST.slotClosed[t]=1;else delete ST.slotClosed[t];render();await api('set_slot',{date:d,slot_time:t,closed:closed});}
function renderSlots(){
  const d=hkdate(new Date().toISOString());
  return '<div style="font-size:13px;color:var(--muted);margin:6px 4px 12px">今日（'+dayLabel(new Date().toISOString())+'）取餐時段 · 全部預設開放。㩒一下即關閉，客人揀唔到；再㩒開返。</div>'+
    '<div class="slotgrid">'+slotTimes().map(function(t){var c=!!ST.slotClosed[t];return '<button class="slotbtn '+(c?'closed':'open')+'" onclick="toggleSlot(\''+t+'\')">'+t+'<small>'+(c?'已關':'開放')+'</small></button>';}).join('')+'</div>';
}
render();
if(PW)refresh(),startPoll();
</script>
</body>
</html>
