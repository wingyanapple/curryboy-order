    --bg:#0e0b08;--bg2:#080605;--card:#1a130d;--orange:#e8951e;--gold:#f4c044;
    --cream:#f6e7c6;--cream2:#fbeed0;--red:#c8102e;--red-deep:#7c0d1c;--muted:#b59f7d;
    --soldout:#4a423a;--line:#33271b;--coming:#7ad0e8;
    --pixel:'Press Start 2P',system-ui,monospace;--han:'Noto Sans HK','PingFang HK','Microsoft JhengHei',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);font-family:var(--han);color:var(--cream);-webkit-font-smoothing:antialiased;line-height:1.45}
  #app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:30px}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* appbar */
  .appbar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 14px;background:linear-gradient(180deg,var(--bg2),rgba(8,6,5,.9));backdrop-filter:blur(5px);border-bottom:1px solid var(--line)}
  .back{justify-self:start;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#171210;color:var(--cream);font-size:20px}
  .brand{justify-self:center;height:26px;width:140px;background:var(--logo) center/contain no-repeat}
  .lang{justify-self:end;font-family:var(--pixel);font-size:8px;color:var(--cream);border:1.5px solid var(--line);border-radius:7px;padding:6px 7px}
  .lang b{color:var(--gold)}

  /* home */
  .home-hero{min-height:74vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:46px 24px 18px}
  .hero-top{display:flex;flex-direction:column;align-items:center}
  .hero-logo{height:64px;width:262px;background:var(--logo) center/contain no-repeat}
  .hero-sub{margin-top:16px;color:var(--muted);font-size:13px;letter-spacing:4px}
  .hero-mid{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
  .big-start{width:100%;max-width:286px;background:var(--orange);color:#1a1208;border:none;border-radius:18px;padding:26px;font-weight:900;font-size:23px;letter-spacing:2px;box-shadow:5px 5px 0 #000}
  .big-start span{display:block;font-family:var(--pixel);font-size:9px;margin-top:9px;opacity:.8}
  .announce{width:100%;max-width:334px;background:#160f0a;border:1px solid #3a2a14;border-left:4px solid var(--orange);border-radius:12px;padding:12px 14px;text-align:left}
  .an-tag{display:flex;align-items:center;gap:6px;font-family:var(--pixel);font-size:8px;color:var(--orange);margin-bottom:7px}
  .an-body{font-size:13px;color:var(--cream2);line-height:1.5}
  .scrollhint{color:var(--muted);font-size:12px;opacity:.8}

  .sec-h{display:flex;align-items:center;gap:8px;padding:22px 18px 10px}
  .sec-h .bar{width:5px;height:18px;background:var(--orange);border-radius:2px}
  .sec-h h2{font-weight:900;font-size:17px;color:var(--cream2)}
  .sec-h .en{font-family:var(--pixel);font-size:8px;color:var(--muted)}

  .curry-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 16px}
  .cc{border-radius:16px;border:2.5px solid var(--orange);padding:16px;position:relative;overflow:hidden;aspect-ratio:1/1;min-height:0;display:flex;flex-direction:column;justify-content:center}
  .cc.butter{background:#f3e3b8;color:#23170a}.cc.ghost{background:#5a1414;color:#f6e7c6}
  .cc.king{background:#2a2014;color:#f6e7c6}.cc.queen{background:#163029;color:#f6e7c6}
  .cc .pic{height:50px;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(0,0,0,.18);font-size:9px;opacity:.6}
  .cc.ghost .pic,.cc.king .pic,.cc.queen .pic{border-color:rgba(255,255,255,.18)}
  .cc .han{font-weight:900;font-size:21px;line-height:1.15}
  .cc .en{font-family:var(--pixel);font-size:8.5px;margin-top:8px;color:var(--red)}.cc.butter .en{color:#b3201a}
  .cc .meta{display:flex;align-items:center;gap:6px;margin-top:13px;font-size:12px}
  .spice{display:flex;gap:3px;align-items:center}.chili{font-size:15px;line-height:1}.chili.off{opacity:.28;filter:grayscale(.7)}
  .cc.ghost .spice i.off,.cc.king .spice i.off,.cc.queen .spice i.off{background:rgba(255,255,255,.16)}
  .cc .coming{position:absolute;top:8px;right:8px;background:#0e1b24;color:var(--coming);font-size:9px;font-weight:700;border-radius:5px;padding:2px 6px;border:1px solid var(--coming)}
  .nochili{font-size:12px;font-weight:700;opacity:.9}
  /* 四款咖喱：相片卡 */
  .curry-pics{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:2px 16px}
  .cpic{position:relative;border-radius:16px;overflow:hidden;border:2.5px solid var(--orange);cursor:pointer;background:#000;-webkit-tap-highlight-color:transparent}
  .cpic img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
  .cpic-spice{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75) 42%);padding:20px 8px 9px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
  .cpic-lbl{color:#fff;font-size:12px;font-weight:800;margin-right:2px}
  .cpic-spice .nochili{color:#fff;opacity:1}
  .cpic .coming{position:absolute;top:8px;right:8px;background:#0e1b24;color:var(--coming);font-size:9px;font-weight:700;border-radius:5px;padding:2px 6px;border:1px solid var(--coming);z-index:2}
  .cpic-full{max-width:94vw;max-height:90vh;border-radius:14px;display:block}

  .rank{padding:2px 16px}
  .rrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .rk{font-family:var(--pixel);font-size:11px;width:34px;text-align:center}
  .rrow:nth-child(1) .rk{color:#ffcf3f}.rrow:nth-child(2) .rk{color:#cfd3da}.rrow:nth-child(3) .rk{color:#d79a5b}
  .rthumb{width:34px;height:34px;border-radius:8px;background:#0f0a06;border:1px solid var(--line);font-size:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .rname{font-weight:700;font-size:14px;color:var(--cream2)}
  .rname span{display:block;font-family:var(--pixel);font-size:7px;color:var(--muted);margin-top:3px}

  .mapcard{margin:2px 16px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--card)}
  .mapimg{height:104px;position:relative;background:linear-gradient(rgba(20,15,10,.2),rgba(20,15,10,.2)),repeating-linear-gradient(0deg,#1d2a24 0 22px,#19241f 22px 44px),repeating-linear-gradient(90deg,#1d2a24 0 30px,#19241f 30px 60px)}
  .pin{position:absolute;top:32px;left:50%;transform:translateX(-50%)}
  .pin .dot{width:18px;height:18px;border-radius:50% 50% 50% 0;background:var(--red);transform:rotate(45deg);border:2px solid #fff}
  .maptxt{padding:11px 13px;font-size:13px;color:var(--cream2);display:flex;align-items:center;gap:8px}
  .home-foot{display:flex;align-items:center;justify-content:center;gap:8px;padding:22px 16px 16px;color:var(--muted);font-size:13px}
  .home-foot a{color:var(--gold);font-weight:700}
  .admin-link{display:block;text-align:center;color:#5e5344;font-size:11px;padding:6px;letter-spacing:1px}
  .addr-block{width:100%;margin-top:20px}
  .addr-txt{font-size:13.5px;color:var(--cream2);display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:11px}
  .gmap{width:100%;height:200px;border:1px solid var(--line);border-radius:13px;display:block}
  .mapbtn{display:block;text-align:center;margin-top:11px;background:#16110b;border:1px solid var(--line);color:var(--gold);border-radius:11px;padding:12px;font-weight:800;text-decoration:none}

  /* menu */
  .setcard{display:flex;align-items:center;gap:13px;margin:12px 16px 0;border-radius:16px;padding:14px;border:2px solid var(--line);position:relative}
  .setcard.curry{background:linear-gradient(120deg,#241a10,#19120b)}
  .setcard.udon{background:linear-gradient(120deg,#16201d,#10100c)}
  .setcard .pic{width:62px;height:62px;border-radius:12px;flex:none;border:1px dashed rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
  .setcard .info{flex:1}
  .setcard .han{font-weight:900;font-size:18px;color:var(--cream2)}
  .setcard .en{font-family:var(--pixel);font-size:7px;color:var(--muted);margin-top:6px}
  .setcard .pr{font-family:var(--pixel);font-size:20px;color:var(--gold);text-shadow:2px 2px 0 var(--red-deep)}
  .setcard .pr small{font-family:var(--han);font-size:11px;color:var(--muted)}

  .listcard{margin:8px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:none}
  .li .nm{flex:1;font-weight:700;font-size:15px;color:var(--cream2)}
  .li .nm small{display:block;font-family:var(--pixel);font-size:7px;color:var(--muted);margin-top:3px}
  .li .pr{font-weight:700;color:var(--gold);font-size:14px;margin-right:4px}
  .li .addbtn{width:34px;height:34px;border-radius:9px;background:var(--orange);color:#1a1208;border:none;font-size:20px;font-weight:700;line-height:1}
  .li.so{opacity:.45}.li.so .nm{color:var(--soldout)}
  .li .sobadge{font-size:11px;font-weight:700;color:#ff8a8a;border:1px solid #ff8a8a;border-radius:5px;padding:1px 6px}
  .rec{display:inline-flex;vertical-align:-2px;margin-right:5px}
  /* home feedback button */
  .fb-btn{width:100%;max-width:286px;background:transparent;color:var(--orange);border:1.5px solid var(--orange);border-radius:14px;padding:13px;font-weight:800;font-size:15px;letter-spacing:1px}
  /* snack/drink grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:6px 16px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 13px 12px;display:flex;flex-direction:column;min-height:118px;position:relative}
  .gcard .gname{font-weight:800;font-size:15px;color:var(--cream2);line-height:1.25}
  .gcard .gen{font-family:var(--pixel);font-size:6.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .gcard .gprice{font-weight:800;color:var(--gold);font-size:15px;margin-top:auto}
  .gcard .gstep{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
  .gadd{width:100%;background:var(--orange);color:#1a1208;border:none;border-radius:9px;padding:9px;font-weight:800;font-size:14px;margin-top:9px}
  .gstepper{display:flex;align-items:center;gap:6px;width:100%;justify-content:space-between;margin-top:9px;background:#100b07;border:1px solid var(--line);border-radius:9px;padding:5px 8px}
  .gstepper button{width:28px;height:28px;border-radius:7px;border:none;background:var(--orange);color:#1a1208;font-size:18px;font-weight:700;line-height:1}
  .gstepper b{color:var(--gold);font-size:16px}
  .gcard.so{opacity:.5}.gcard .sob{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;color:#ff8a8a;border:1px solid #ff8a8a;border-radius:5px;padding:1px 6px}
  .grec{position:absolute;top:10px;left:10px}
  /* 小食：一項一行（橫向） */
  .lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:9px 16px 0}
  .lrow.so{opacity:.5}
  .lrow .lmain{flex:1;min-width:0}
  .lrow .lname{font-weight:800;font-size:15.5px;color:var(--cream2);display:flex;align-items:center;gap:7px;line-height:1.3}
  .lrow .lname .rec{position:static;flex:none}
  .lrow .len{font-family:var(--pixel);font-size:6.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .lrow .lright{flex:none;display:flex;align-items:center;gap:12px}
  .lrow .lprice{font-weight:800;color:var(--gold);font-size:16px}
  .lrow .ladd{background:var(--orange);color:#1a1208;border:none;border-radius:9px;padding:9px 15px;font-weight:800;font-size:14px;white-space:nowrap}
  .lrow .lstep{display:flex;align-items:center;gap:8px;background:#100b07;border:1px solid var(--line);border-radius:9px;padding:5px 8px}
  .lrow .lstep button{width:28px;height:28px;border-radius:7px;border:none;background:var(--orange);color:#1a1208;font-size:18px;font-weight:700;line-height:1}
  .lrow .lstep b{color:var(--gold);font-size:16px;min-width:16px;text-align:center}
  .lrow .lsob{font-size:11px;font-weight:700;color:#ff8a8a;border:1px solid #ff8a8a;border-radius:6px;padding:3px 8px}
  /* continue order btn */
  .cont-btn{width:100%;background:transparent;color:var(--cream2);border:1.5px solid var(--line);border-radius:12px;padding:13px;font-weight:700;font-size:14px;margin-bottom:10px}
  /* admin menu manager */
  .mrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e6e8eb;border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .mrow .mn{flex:1;font-size:14px;font-weight:600;color:#1f2328}.mrow .mn small{color:#9aa0a6;font-weight:500;display:block;margin-top:2px}
  .mrow .mp{font-weight:700;color:#13161a;font-size:13px}
  .mrow .mstar{width:32px;height:30px;border-radius:7px;border:1px solid #e6e8eb;background:#fff;display:flex;align-items:center;justify-content:center}
  .mrow .mstar svg{width:16px;height:16px}
  .mrow .mstar:not(.on){opacity:.35}
  .mrow .mstar.on{background:#fff6e5;border-color:#f4c044}
  .sheet.msheet{background:#fff;color:#1f2328}.sheet.msheet h3{color:#13161a}
  .mrow .me,.mrow .md{font-size:12px;font-weight:700;border:1px solid #e6e8eb;background:#fff;border-radius:7px;padding:6px 9px;color:#1f2328}
  .mrow .md{color:#c0353a;border-color:#f3cccc}
  .maddbtn{width:100%;border:1px dashed #c7ccd1;background:#fff;border-radius:10px;padding:11px;font-weight:700;color:#1f2328;font-size:13px;margin-bottom:14px}
  .msheet label{display:block;font-size:12px;color:#6b7280;font-weight:600;margin:10px 0 5px}
  .msheet input{width:100%;border:1px solid #e6e8eb;border-radius:10px;padding:11px;font-size:15px;font-family:var(--han)}
  .msheet .row2{display:flex;gap:10px}.msheet .row2>div{flex:1}
  .msheet .save{width:100%;background:#1f2328;color:#fff;border:none;border-radius:11px;padding:13px;font-weight:800;margin-top:16px}
  .basebox{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e6e8eb;border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .basebox .bn{flex:1;font-weight:700}.basebox input{width:90px;border:1px solid #e6e8eb;border-radius:8px;padding:8px;font-size:15px;text-align:right}
  .visit{font-size:11px;font-weight:700;background:#eef0f2;color:#4a5056;border-radius:6px;padding:2px 7px;margin-left:8px}
  .visit.vip{background:#fff1d6;color:#9a6213}
  .osort{display:flex;gap:8px;margin-bottom:12px}
  .osort button{flex:1;font-size:13px;font-weight:700;border:1px solid #e6e8eb;background:#fff;border-radius:9px;padding:9px;color:#6b7280}
  .osort button.on{background:#1f2328;color:#fff;border-color:#1f2328}
  .othumb{width:44px;height:44px;flex:none;border-radius:9px;background:#0f0a06;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .othumb img{max-width:38px;max-height:38px;image-rendering:pixelated;image-rendering:crisp-edges}
  .cc .pic.haspic{border:none;background:none;height:58px}
  .cc .pic.haspic img{height:58px;image-rendering:pixelated}
  .setcard .pic.haspic{border:none}.setcard .pic.haspic img{max-width:56px;max-height:56px;image-rendering:pixelated}
  .rthumb img{max-width:30px;max-height:30px;image-rendering:pixelated}

  .feedback-entry{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:14px 16px 22px;background:#160f0a;border:1px dashed var(--orange);border-radius:13px;padding:14px;color:var(--cream2);text-align:left}
  .feedback-entry .ic{width:34px;height:34px;flex:none;border-radius:9px;background:rgba(232,149,30,.14);display:flex;align-items:center;justify-content:center}
  .feedback-entry .tx{flex:1}.feedback-entry .tx b{font-weight:800;font-size:14px}
  .feedback-entry .tx small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
  .feedback-entry .arr{color:var(--orange);font-size:20px}

  /* builder */
  .b-title{padding:14px 16px 4px;font-weight:900;font-size:19px;color:var(--cream2)}
  .b-title em{font-family:var(--pixel);font-style:normal;font-size:13px;color:var(--gold);margin-left:6px}
  .stepbar{margin:14px 16px 8px;display:flex;align-items:center;gap:10px;background:var(--red);border-radius:30px;padding:9px 16px;box-shadow:3px 3px 0 #000}
  .stepbar .n{font-family:var(--pixel);font-size:11px;color:#fff}
  .stepbar .chev{color:#fff;opacity:.8;font-weight:900}
  .stepbar .lbl{font-weight:900;font-size:15px;color:var(--cream2)}
  .stepbar .lbl small{display:block;font-family:var(--pixel);font-size:7px;opacity:.85;margin-top:2px}
  .opts{padding:0 16px}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .radio{width:21px;height:21px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
  .opt.on .radio{border-color:var(--orange)}.opt.on .radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--orange)}
  .boxc{width:21px;height:21px;border-radius:6px;border:2px solid var(--muted);flex:none;position:relative}
  .opt.on .boxc{border-color:var(--orange);background:var(--orange)}
  .opt.on .boxc::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #1a1208;border-width:0 3px 3px 0;transform:rotate(42deg)}
  .opt .t{flex:1;font-weight:700;font-size:15px;color:var(--cream2)}
  .opt .t small{display:block;font-family:var(--pixel);font-size:7px;color:var(--muted);margin-top:3px}
  .opt .add{font-weight:700;font-size:14px;color:var(--gold)}
  .opt.dis{opacity:.5;pointer-events:none}.opt.dis .t{color:var(--soldout)}
  .so-tag{font-size:11px;font-weight:700;color:#ff8a8a;border:1px solid #ff8a8a;border-radius:5px;padding:1px 6px}
  .coming-tag{font-size:11px;font-weight:700;color:var(--coming);border:1px solid var(--coming);border-radius:5px;padding:1px 6px}
  .strike{color:var(--muted);text-decoration:line-through;font-size:12px;margin-left:7px;font-weight:500}
  .grp-cap{padding:16px 16px 2px;font-weight:900;color:var(--orange);font-size:14px}
  .inp{width:100%;background:#100b07;border:1px solid var(--line);border-radius:11px;padding:14px;color:var(--cream2);font-size:15px;font-family:var(--han)}
  .inp::placeholder{color:#5e5344}
  .field{padding:6px 16px 8px}
  .lab{font-weight:900;font-size:15px;color:var(--cream2);margin:14px 0 9px;display:flex;gap:7px;align-items:center}
  .req{color:#fff;background:var(--red);font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px}

  .summary{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
  .qty{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;padding:7px 11px}
  .qty button{background:none;border:none;color:var(--gold);font-size:18px;width:18px}.qty b{font-size:16px;color:var(--gold);min-width:14px;text-align:center}
  .add-cart{flex:1;font-family:var(--pixel);font-size:11px;color:#1a1208;background:var(--orange);border:none;border-radius:11px;padding:13px;box-shadow:3px 3px 0 #000}
  .add-cart span{display:block;font-family:var(--han);font-size:12px;font-weight:900;margin-top:4px}

  /* cart */
  .citem{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
  .citem .ct{font-weight:800;font-size:15px;color:var(--cream2)}
  .citem .cd{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .citem .cr{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
  .citem .cr .price{font-weight:800;color:var(--gold)}
  .citem .acts{display:flex;gap:8px;align-items:center}
  .citem .acts .edit{font-size:12px;color:var(--cream2);background:#171210;border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  .citem .acts .del{font-size:12px;color:#ff8a8a;background:none;border:1px solid #5a2a2a;border-radius:8px;padding:7px 11px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}

  /* slots */
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .slot{text-align:center;font-weight:700;font-size:13px;padding:11px 0;border-radius:9px;border:1px solid var(--line);background:#100b07;color:var(--cream2)}
  .slot.on{background:var(--orange);color:#1a1208;border-color:var(--orange)}
  .slot.full{color:var(--soldout);background:#0c0805;text-decoration:line-through;pointer-events:none}
  .slot small{display:block;font-size:9px;font-weight:500;color:#ff8a8a;text-decoration:none;margin-top:2px}
  .util2{display:flex;gap:9px}
  .uchip{flex:none;padding:0 16px;height:50px;border-radius:11px;border:1.5px solid var(--line);background:#100b07;color:var(--cream2);font-weight:700;font-size:14px}
  .uchip.on{border-color:var(--orange);background:rgba(232,149,30,.12);color:var(--gold)}
  .ustep{flex:1;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:11px;padding:0 14px;height:50px}
  .ustep.on{border-color:var(--orange);background:rgba(232,149,30,.1)}
  .ustep .w{font-weight:700;font-size:14px;color:var(--cream2)}
  .ustep button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#100b07;color:var(--gold);font-size:17px}
  .ustep b{font-size:16px;color:var(--gold)}.ustep small{margin-left:auto;color:var(--muted);font-size:11px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .errline{color:#ff8a8a;font-size:13px;padding:4px 16px;font-weight:600}
  .cta-wrap{position:sticky;bottom:0;padding:14px 16px;background:linear-gradient(0deg,var(--bg) 72%,transparent)}

/* ---------- BUILD logic ---------- */
function findSet(id){return DB.sets.find(s=>s.id===id);}
function buildDon(b){return b.donId?find('donburi',b.donId):null;}
function openBuild(setId,editIndex){
  const set=findSet(setId);
  const def={setId,main:firstAvail('mains'),extras:[],drink:'none',snack:null,note:'',qty:1,editIndex:(editIndex??-1)};
  if(set.kind==='curry')def.curry=firstAvail('curries');
  if(set.kind==='soup')def.soup=firstAvail('soups');
  if(set.noodle)def.noodle=set.noodle[0].id;
  if(editIndex!=null&&editIndex>-1){Object.assign(def,JSON.parse(JSON.stringify(S.cart[editIndex].sel)),{note:S.cart[editIndex].note,qty:S.cart[editIndex].qty,editIndex});}
  S.build=def;go('build');
}
function openDonburi(donId,editIndex){
  const def={donId,extras:[],drink:'none',snack:null,note:'',qty:1,editIndex:(editIndex??-1)};
  if(editIndex!=null&&editIndex>-1){Object.assign(def,JSON.parse(JSON.stringify(S.cart[editIndex].sel)),{note:S.cart[editIndex].note,qty:S.cart[editIndex].qty,editIndex});}
  S.build=def;go('build');
}
function firstAvail(arr,pfx){const f=DB[arr].find(o=>o.status==='available'&&(!pfx||o.id.startsWith(pfx)));return (f||DB[arr][0]).id;}
/* 加購小食（每款減 snackSetDiscount，限一款）；none = 唔加 */
function setSnackOpts(){
  const list=[{id:'none',zh:'不加小食',en:'NO SNACK',delta:0,status:'available'}];
  DB.snacks.forEach(s=>list.push({id:s.id,zh:s.zh,en:s.en,delta:Math.max(0,s.price-DB.snackSetDiscount),orig:s.price,status:s.status,rec:s.rec}));
  return list;
}
function buildTotal(){
  const b=S.build;let base;const don=buildDon(b);
  if(don){base=don.price;}
  else{const set=findSet(b.setId);base=set.price;
    if(set.kind==='curry')base+=find('curries',b.curry).delta;
    if(set.kind==='soup')base+=find('soups',b.soup).delta;
    if(set.noodle){const n=set.noodle.find(x=>x.id===b.noodle);base+=n?n.delta:0;}
    base+=find('mains',b.main).delta;}
  b.extras.forEach(id=>base+=find('extras',id).delta);
  const d=setDrinkById(b.drink);base+=d?d.delta:0;
  if(b.snack){const sk=find('snacks',b.snack);if(sk)base+=Math.max(0,sk.price-DB.snackSetDiscount);}
  return base*b.qty;
}
function buildLabel(b){const don=buildDon(b);return don?don.zh:findSet(b.setId).zh;}
function buildDesc(b){
  const parts=[];const don=buildDon(b);
  if(!don){const set=findSet(b.setId);
    if(set.kind==='curry')parts.push(find('curries',b.curry).zh);
    if(set.kind==='soup')parts.push(find('soups',b.soup).zh);
    if(set.noodle){const n=set.noodle.find(x=>x.id===b.noodle);if(n)parts.push(n.zh);}
    else if(set.fixed)parts.push(set.fixed.zh);
    parts.push(find('mains',b.main).zh);}
  b.extras.forEach(id=>parts.push('+'+find('extras',id).zh));
  if(b.snack){const sk=find('snacks',b.snack);if(sk)parts.push('小食:'+sk.zh);}
  const d=setDrinkById(b.drink);if(d&&d.id!=='none')parts.push('飲品:'+d.zh);
  return parts.join(' · ');
}
function addBuildToCart(){
  const b=S.build;const item={type:b.donId?'don':'set',label:buildLabel(b),sel:{...b},qty:b.qty,note:b.note,unit:buildTotal()/b.qty,desc:buildDesc(b)};
  delete item.sel.editIndex;delete item.sel.qty;delete item.sel.note;
  if(b.editIndex>-1){S.cart[b.editIndex]=item;toast('已更新');}else{S.cart.push(item);toast('已加入購物車');}
  Store.save();go('menu');
}

function cartTotal(){return S.cart.reduce((s,i)=>s+i.unit*i.qty,0);}
function cartPortions(){return S.cart.reduce((s,i)=>s+i.qty,0);}
function addSimple(arr,id){const p=find(arr,id);if(p.status!=='available'){toast('已售罄');return;}
  const ex=S.cart.find(i=>i.type==='item'&&i.pid===id&&!i.note);
  if(ex){ex.qty++;}else{S.cart.push({type:'item',pid:id,label:p.zh,qty:1,unit:p.price,note:'',desc:p.en});}

/* ---------- payment (MOCK) ---------- */
async function payReal(){
  const c=S.checkout;c.err='';c.phoneErr='';
  const phone=($('phoneInput')?$('phoneInput').value:'').replace(/\s/g,'');
  if(c.utensil===null){c.err='請先揀外賣餐具（不需要或份數）';render();return;}
  if(c.slot===null){c.err='請揀取餐時間';render();return;}
  if(!/^[2-9]\d{7}$/.test(phone)){c.phoneErr='請輸入有效嘅 8 位香港電話號碼';render();return;}
  const slot=DB.slots.find(s=>s.time===c.slot);
  if(slot&&slotStatus(slot)==='full'){c.err='呢個時段已關閉，請另揀';c.slot=null;render();return;}
  if(!S.cart.length){c.err='購物車係空嘅';render();return;}
  const utensil=c.utensil||0;
  const total=cartTotal()+utensil*DB.utensilPrice;
  const items=S.cart.map(it=>({label:it.label,kind:it.type,pid:it.pid||null,qty:it.qty,unit:it.unit,item_desc:it.desc||'',note:it.note||'',sel:it.sel||null}));
  S.paying=true;render();
  try{
    const resp=await fetch(CFG.FN_URL,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':CFG.ANON,'Authorization':'Bearer '+CFG.ANON},
      body:JSON.stringify({phone,pickup_slot:c.slot,utensil,total,items,return_base:location.origin+location.pathname})});
    const data=await resp.json().catch(()=>({}));
    if(data&&data.ok&&data.payment_link){
      window.location.href=data.payment_link;return;   // 跳去 Wonder 俾錢（購物車保留，成功返嚟先清）
    }
    S.paying=false;
    c.err='落單失敗：'+((data&&(data.error||(data.wonder_response&&data.wonder_response.message)))||'請重試');
    render();
  }catch(e){S.paying=false;c.err='網絡問題，請重試';render();}
}

function kpiBlock(list){
  const rev=list.reduce((s,o)=>s+o.total,0),cnt=list.length;
  const bs={paid:0,making:0,done:0};list.forEach(o=>bs[o.status]++);
  const tally={};list.forEach(o=>o.items.forEach(it=>{tally[it.label]=(tally[it.label]||0)+it.qty;}));
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  return '<div class="stat"><div class="kpi"><div class="v">$'+rev+'</div><div class="l">營業額</div></div><div class="kpi"><div class="v">'+cnt+'</div><div class="l">訂單數</div></div></div>'+
    '<div class="stat"><div class="kpi"><div class="v" style="color:#e5484d">'+bs.paid+'</div><div class="l">待處理</div></div><div class="kpi"><div class="v" style="color:#30a46c">'+bs.done+'</div><div class="l">已完成</div></div></div>'+
    '<h3>銷售統計</h3>'+(top.length?top.map(([n,q])=>'<div class="inv"><div class="nm">'+n+'</div><div style="font-weight:800">×'+q+'</div></div>').join(''):'<div style="color:#9aa0a6">未有銷售</div>');
}

}
function adminStats(){
  const rep=S.admin.rep; if(!rep.month)rep.month=mstr(Date.now());
  const seg='<div class="osort"><button class="'+(rep.mode==='today'?'on':'')+'" onclick="repMode(\'today\')">今日</button><button class="'+(rep.mode==='daily'?'on':'')+'" onclick="repMode(\'daily\')">日結</button><button class="'+(rep.mode==='monthly'?'on':'')+'" onclick="repMode(\'monthly\')">月結</button></div>';
  if(rep.day)return seg+dayDetail(rep.day);
  if(rep.mode==='today')return seg+kpiBlock(DB.orders.filter(o=>dstr(o.ts)===today()));
  if(rep.mode==='daily')return seg+dailyList();
  return seg+monthlyView();
}
function dailyList(){
  const days={};DB.orders.forEach(o=>{const d=dstr(o.ts);(days[d]=days[d]||{rev:0,cnt:0}).rev+=o.total;days[d].cnt++;});
  const rows=Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!rows.length)return '<div style="text-align:center;color:#9aa0a6;padding:34px">未有資料</div>';
  return '<h3>每日一覽（撳入去睇當日詳情）</h3>'+rows.map(([d,v])=>'<div class="slotrow" style="cursor:pointer" onclick="openDay(\''+d+'\')"><span class="tm" style="width:auto;font-size:14px">'+d+'</span><span class="cnt" style="margin-left:10px">'+v.cnt+' 單</span><span style="margin-left:auto;font-weight:800;margin-right:10px">$'+v.rev+'</span><button>詳情</button></div>').join('');
}
function monthlyView(){
  const m=S.admin.rep.month;
  const list=DB.orders.filter(o=>mstr(o.ts)===m);
  const nav='<div class="basebox" style="justify-content:space-between"><button class="me" onclick="monthShift(-1)">‹ 上月</button><b style="font-size:16px">'+m+'</b><button class="me" onclick="monthShift(1)">下月 ›</button></div>';
  const rev=list.reduce((s,o)=>s+o.total,0),cnt=list.length;
  const kpi='<div class="stat"><div class="kpi"><div class="v">$'+rev+'</div><div class="l">全月營業額</div></div><div class="kpi"><div class="v">'+cnt+'</div><div class="l">全月訂單</div></div></div>';
  const days={};list.forEach(o=>{const d=dstr(o.ts);(days[d]=days[d]||{rev:0,cnt:0}).rev+=o.total;days[d].cnt++;});
  const drows=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0]));
  const dayrows=drows.length?drows.map(([d,v])=>'<div class="slotrow" style="cursor:pointer" onclick="openDay(\''+d+'\')"><span class="tm" style="width:auto">'+(+d.slice(8))+' 號</span><span class="cnt" style="margin-left:10px">'+v.cnt+' 單</span><span style="margin-left:auto;font-weight:800;margin-right:10px">$'+v.rev+'</span><button>詳情</button></div>').join(''):'<div style="color:#9aa0a6;padding:14px">呢個月未有訂單</div>';
  const tally={};list.forEach(o=>o.items.forEach(it=>{tally[it.label]=(tally[it.label]||0)+it.qty;}));
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const tallyH='<h3>全月銷售統計</h3>'+(top.length?top.map(([n,q])=>'<div class="inv"><div class="nm">'+n+'</div><div style="font-weight:800">×'+q+'</div></div>').join(''):'<div style="color:#9aa0a6">未有</div>');
  return nav+kpi+'<h3>每日一覽（撳入去睇詳情）</h3>'+dayrows+tallyH;
}
function dayDetail(d){
  const list=DB.orders.filter(o=>dstr(o.ts)===d).sort((a,b)=>a.ts-b.ts);
  return '<button class="maddbtn" style="margin-top:0" onclick="closeDay()">‹ 返回</button><h3>'+d+' 詳情</h3>'+kpiBlock(list)+'<h3>當日訂單（'+list.length+'）</h3>'+list.map(orderCardStatic).join('');
}
window.repMode=m=>{S.admin.rep.mode=m;S.admin.rep.day=null;render();};
window.openDay=d=>{S.admin.rep.day=d;render();};
window.closeDay=()=>{S.admin.rep.day=null;render();};
window.monthShift=n=>{const p=S.admin.rep.month.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);S.admin.rep.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();};

function adminFeedback(){
  if(!DB.feedback.length)return '<div style="text-align:center;color:#9aa0a6;padding:40px">未有顧客意見</div>';
  return DB.feedback.map(f=>'<div class="fbitem"><div class="fh"><span class="fbtype">'+f.type+'</span><span class="fbstars">'+'★'.repeat(f.rating)+'☆'.repeat(5-f.rating)+'</span></div>'+(f.msg?'<div class="fm">'+f.msg+'</div>':'<div class="fm" style="color:#9aa0a6">（冇文字內容）</div>')+'</div>').join('');
}

/* admin entry from customer link */
window.go=go;
const _origGo=go;
window.go=function(s){if(s==='adminLogin'){S.screen='admin';S.admin.logged=false;window.scrollTo(0,0);render();return;}_origGo(s);};

/* 清走舊版 PWA service worker，免舊快取遮住新版 */
if('serviceWorker' in navigator){try{navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});}catch(e){}}
/* 由 Wonder 付款後跳返（?paid=1&no=A001）→ 顯示成功頁 */
(function(){try{const p=new URLSearchParams(location.search);if(p.get('paid')==='1'){S.cart=[];S.lastOrder={no:p.get('no')||'—',pickup:''};S.screen='success';history.replaceState({},'',location.pathname);}}catch(e){}})();
/* 由 Wonder 頁撳返嚟（冇俾錢）→ 解除「處理中」，等佢可以再撳 */
window.addEventListener('pageshow',function(){if(S.paying){S.paying=false;render();}});
render();
</script>
